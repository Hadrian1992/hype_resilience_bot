name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      # NOTE: `cargo fmt -- --check` intentionally omitted for now -
      # the codebase is not rustfmt-clean yet (no local toolchain available).
      - name: Build
        run: cargo build --release
      - name: Run tests
        run: cargo test --workspace --all-features -- --nocapture
