[package]
name = "hype_resilience_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
# Asynchronous runtime
tokio = { version = "1.38", features = ["full"] }
futures-util = "0.3"

# gRPC / protobuf
tonic = { version = "0.11", features = ["tls", "gzip"] }
prost = "0.12"

# Compression
zstd = "0.13"

# Ethereum client (ethers-rs)
ethers = { version = "2.0", features = ["providers", "rustls"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Math / TA
ta = "0.5"
ndarray = "0.15"

# Logging & telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
prometheus = "0.14"
metrics-exporter-prometheus = "0.8"

[build-dependencies]
# Kompilator plików .proto do kodu w języku Rust
tonic-build = "0.11"
