services:
  bot:
    build: .
    container_name: hype_bot
    environment:
      - RPC_URL=${RPC_URL:-https://eth-mainnet.g.alchemy.com/v2/YOUR_KEY}
      - GRPC_URL=${GRPC_URL:-https://your-grpc-endpoint}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TOKENOMIST_URL=${TOKENOMIST_URL:-}
      - WS_FALLBACK_URL=${WS_FALLBACK_URL:-wss://api.hyperliquid.xyz/ws}
      - METRICS_ADDR=0.0.0.0:9898
    ports:
      - "9898:9898"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: hype_prometheus
    volumes:
      - ./prometheus:/etc/prometheus:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: hype_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
